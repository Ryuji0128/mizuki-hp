services:
  next:
    build:
      context: ./next
      dockerfile: Dockerfile.dev
    image: mizuki-hp-dev:latest
    container_name: next_app_dev
    working_dir: /app
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./next/.env
    environment:
      - DATABASE_URL=mysql://${MYSQL_USER:-app_user}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}@mysql:3306/${MYSQL_DATABASE:-app_db}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - AUTH_TRUST_HOST=true
      - NODE_ENV=development
    volumes:
      - ./next:/app
      - ./uploads:/app/public/uploads
    command: sh -c "npx prisma generate && npx prisma db push && npm run dev -- -H 0.0.0.0"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4.11
    container_name: mysql_db_dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app_db}
      MYSQL_USER: ${MYSQL_USER:-app_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    command: >
      --innodb-buffer-pool-size=128M --key-buffer-size=16M --max-connections=30 --table-open-cache=200 --tmp-table-size=16M --max-heap-table-size=16M
    mem_limit: 256m
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 180s

  nginx:
    image: nginx:1.31.4-alpine3.24
    container_name: nginx_proxy_dev
    ports:
      - "127.0.0.1:80:80"
    environment:
      - SERVER_NAME=${SERVER_NAME:-localhost}
    volumes:
      - ./nginx/default.conf.dev.template:/etc/nginx/templates/default.conf.template:ro
      - ./uploads:/var/www/uploads:ro
    depends_on:
      - next
    restart: unless-stopped

volumes:
  mysql_dev_data:
