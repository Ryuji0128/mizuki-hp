# アプリ運用ログ用 logrotate 設定 (一般ユーザーで実行)
#
# /etc/logrotate.d は root 所有のため、ubuntu ユーザーの cron から
# 直接 logrotate 設定を追加できない。以下のように自前で回す。
#
# 設置: cp logrotate/app.conf ~/logrotate-mizuki.conf
#   (リポジトリ内のパスを直接指定すると git reset --hard と衝突しうるため
#    ホームディレクトリにコピーして使う)
#
# cron:
#   20 0 * * * /usr/sbin/logrotate -s ~/.logrotate.state ~/logrotate-mizuki.conf
/home/ubuntu/mizuki-hp/logs/*.log /home/ubuntu/mizuki-hp/certbot-renew.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
