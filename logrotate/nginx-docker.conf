# nginx (Docker) 用 logrotate 設定
#
# 設置: sudo cp logrotate/nginx-docker.conf /etc/logrotate.d/nginx
#
# Ubuntu 標準の /etc/logrotate.d/nginx は postrotate で
#   invoke-rc.d nginx rotate
# を実行するが、nginx はホストのサービスではなく Docker コンテナのため
# このシグナルが届かない。
#
# その結果:
#   1. logrotate が access.log を access.log.1 にリネーム
#   2. nginx は古い inode に書き続ける (新 access.log は空のまま)
#   3. notifempty により翌日以降のローテートもスキップされる
#   4. access.log.1 が無限に成長し、fail2ban は空ファイルを監視し続ける
#
# 実際に 2026-05-31 〜 2026-08-23 の84日分 125MB が1ファイルに溜まり、
# その間 fail2ban の nginx 系 jail が完全に無効化されていた。
/var/log/nginx/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 0640 www-data adm
    sharedscripts
    postrotate
        # コンテナの nginx にログ再オープンを指示する
        docker kill -s USR1 nginx_proxy > /dev/null 2>&1 || true
    endscript
}
