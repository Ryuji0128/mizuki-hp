services:
  next:
    image: ghcr.io/seta-seisakusyo/mizuki-hp:${IMAGE_TAG:-latest}
    container_name: next_app
    ports:
      - "127.0.0.1:2999:3000"
    env_file:
      - ./next/.env
    environment:
      - DATABASE_URL=mysql://${MYSQL_USER:-app_user}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}@mysql:3306/${MYSQL_DATABASE:-app_db}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://mizuki-clinic.jp}
      - AUTH_SECRET=${AUTH_SECRET:?Set AUTH_SECRET in .env}
      - AUTH_TRUST_HOST=true
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=512
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - ./uploads:/app/public/uploads
    command: node server.js
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 768m
    restart: unless-stopped

  mysql:
    image: mysql:8.4.11
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app_db}
      MYSQL_USER: ${MYSQL_USER:-app_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    command: >
      --innodb-buffer-pool-size=96M --key-buffer-size=8M --max-connections=20 --table-open-cache=128 --tmp-table-size=8M --max-heap-table-size=8M --performance_schema=OFF
    mem_limit: 512m
    volumes:
      - ./mysql/data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4.11-alpine3.21
    container_name: redis_cache
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 96m
    restart: unless-stopped

  nginx:
    image: nginx:1.31.4-alpine3.24
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SERVER_NAME=${SERVER_NAME:?Set SERVER_NAME in .env}
      - CERT_NAME=${CERT_NAME:-${SERVER_NAME}}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/conf.d/default.conf.template:ro
      - ./nginx/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./uploads:/var/www/uploads:ro
      - /var/log/nginx:/var/log/nginx
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    depends_on:
      next:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 96m
    restart: unless-stopped

  certbot:
    image: certbot/certbot:v5.7.0
    container_name: certbot
    profiles: ["ssl"]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email ${CERTBOT_EMAIL:?Set CERTBOT_EMAIL in .env} --agree-tos --no-eff-email -d ${CERTBOT_DOMAINS:?Set CERTBOT_DOMAINS in .env} --keep-until-expiring
